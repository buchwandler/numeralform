[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "numeralform"
version = "0.1.4"
description = "Typed, locale-aware number-to-words rendering with explicit grammar and deterministic num2words compatibility"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "numeralform contributors" }]
classifiers = [
    "Natural Language :: English",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Development Status :: 3 - Alpha",
]

[project.urls]
Homepage = "https://github.com/buchwandler/numeralform"
Repository = "https://github.com/buchwandler/numeralform"
Issues = "https://github.com/buchwandler/numeralform/issues"
Documentation = "https://github.com/buchwandler/numeralform#readme"

[project.scripts]
numeralform = "numeralform.cli:main"


[project.optional-dependencies]
test = [
    "pytest>=8",
    "coverage>=7",
    "mypy>=1.11",
]
[tool.setuptools]
[tool.setuptools.packages.find]
include = ["numeralform*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
]

[tool.coverage.run]
branch = true
source = ["numeralform"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
exclude = ["benchmarks/data"]
