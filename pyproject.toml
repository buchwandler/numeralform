[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numeralform"
version = "0.1.0"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "numeralform contributors" }]
classifiers = [
    "Natural Language :: English",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 3 - Alpha",
]

[project.urls]
Homepage = "https://github.com/nahrstaedt/numeralform"
Repository = "https://github.com/nahrstaedt/numeralform"
Issues = "https://github.com/nahrstaedt/numeralform/issues"
Documentation = "https://github.com/nahrstaedt/numeralform#readme"

[project.scripts]
numeralform = "numeralform.cli:main"


[project.optional-dependencies]
test = [
    "pytest>=8",
    "coverage>=7",
]
[tool.setuptools]
[tool.setuptools.packages.find]
include = ["numeralform*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
]

[tool.coverage.run]
branch = true
source = ["numeralform"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
exclude = ["benchmarks/data"]
