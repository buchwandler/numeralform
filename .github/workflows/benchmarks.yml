name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  num2words:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Numeralform and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Acquire pinned oracle
        run: python -m benchmarks.download num2words
      - name: Run compatibility benchmark
        run: python -m benchmarks.run num2words
      - name: Run benchmark framework tests
        run: python -m pytest benchmarks/tests
      - name: Run upstream tests through the adapter
        env:
          PYTHONPATH: benchmarks/data/results/num2words-shim:benchmarks/data/oracles/num2words:.
        run: |
          mkdir -p benchmarks/data/results/num2words-shim/num2words
          printf '%s\n' 'from numeralform.compat import num2words' '__all__ = ["num2words"]' > benchmarks/data/results/num2words-shim/num2words/__init__.py
          python -m pytest -q benchmarks/data/oracles/num2words/tests

  num2words-random:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: canonical
            failure_flag: --fail-on-unaccepted
          - target: compat
            failure_flag: --fail-on-diff
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Numeralform and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Acquire pinned oracle
        run: python -m benchmarks.download num2words
      - name: Run randomized benchmark
        run: |
          python -m benchmarks.randomized \
            --cases 10000 \
            --seed 20260910 \
            --target "${{ matrix.target }}" \
            --output-dir "benchmarks/data/results/num2words-random-${{ matrix.target }}" \
            "${{ matrix.failure_flag }}" \
            --fail-on-coverage-gap
      - name: Upload randomized benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: num2words-random-${{ matrix.target }}
          path: benchmarks/data/results/num2words-random-${{ matrix.target }}

  cldr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Numeralform and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run pinned CLDR benchmark
        run: python -m benchmarks.run cldr
      - name: Run benchmark framework tests
        run: python -m pytest benchmarks/tests
