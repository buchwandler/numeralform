name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/validation/check.py --corpus tests/validation
      - run: python -c "import sys; import numeralform; assert 'num2words' not in sys.modules; assert 'icu' not in sys.modules"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install coverage
      - run: python -m coverage run --branch -m unittest discover -s tests -v
      - run: python -m coverage report --fail-under=90

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build --sdist --wheel --no-isolation
      - run: python -c "import pathlib, zipfile; assert any('numeralform-0.1.0' in p.name for p in pathlib.Path('dist').iterdir()); wheel = next(p for p in pathlib.Path('dist').glob('*.whl')); assert any(n.endswith('numeralform/py.typed') for n in zipfile.ZipFile(wheel).namelist())"
      - run: python -m pip install dist/*.whl
      - run: python -c "import numeralform; assert numeralform.__version__ == '0.1.0'; assert numeralform.render(42, locale='en') == 'forty-two'"
      - run: numeralform --version
